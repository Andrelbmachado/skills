<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Jump</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: end center; background: #f3efe7; }
  .ground { position: fixed; bottom: 80px; left: 0; right: 0; height: 2px; background: #222; }
  .blob {
    width: 80px; height: 80px; margin-bottom: 82px;
    background: #3a6fe8; border-radius: 22px;
    animation: jump 1.2s ease-in-out infinite;
  }
  @keyframes jump {
    0%   { transform: translateY(0); }
    50%  { transform: translateY(-220px); }
    100% { transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="ground"></div>
  <div class="blob"></div>
</body>
</html>
